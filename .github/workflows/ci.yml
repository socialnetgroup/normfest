name: CI

on:
  push:
    branches: [main]
  pull_request:

# Serialize runs on the same ref instead of letting them overlap (2026-07-31
# real incident: the RLS test suite temporarily forces settings.visibility_mode
# to 'shared' for its duration and restores the real value in afterAll — two
# overlapping runs (a local test run racing a CI run triggered moments apart)
# each captured "the current value" as their own restore target, and the
# later-finishing run restored the wrong (already-forced) value, leaving
# production stuck on 'shared' after both runs completed successfully).
# Deliberately NOT cancel-in-progress: cancelling a running job kills it
# before its afterAll cleanup can run, which would leave the same stuck
# 'shared' value -- queuing (the default when cancel-in-progress is omitted)
# ensures every run's afterAll actually completes before the next one starts.
concurrency:
  group: ci-${{ github.ref }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Requires a SUPABASE_ACCESS_TOKEN repo secret (Supabase Dashboard ->
      # Account -> Access Tokens), separate from the anon/service-role keys
      # above. See CLAUDE.md §12 for the manual setup step.
      # SUPABASE_TELEMETRY_DISABLED avoids a real CLI bug: on `supabase link`'s
      # exit, it tries to flush usage stats to PostHog and this CI runner's
      # network can't reach it in time, so the whole step failed with exit
      # code 1 even though `link` itself had already succeeded (confirmed via
      # a local repro: the "Timeout while shutting down PostHog" message and
      # non-zero exit disappear entirely once telemetry is disabled).
      - run: npx supabase link --project-ref ethykzocikyirmoztrtq && npx supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TELEMETRY_DISABLED: "1"
